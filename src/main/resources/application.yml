spring:
  datasource:
    url: ${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/mysawit_pembayaran}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"

server:
  port: ${PORT:8085}
  address: 0.0.0.0

grpc:
  server:
    port: ${GRPC_PORT:9093}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: mysawit-pembayaran
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

xendit:
  api-key: ${XENDIT_API_KEY:}
  callback-token: ${XENDIT_CALLBACK_TOKEN:}
  success-redirect-url: ${XENDIT_SUCCESS_REDIRECT_URL:}
  failure-redirect-url: ${XENDIT_FAILURE_REDIRECT_URL:}
  exchange-rate: ${XENDIT_EXCHANGE_RATE:10000}
  amount-step: ${XENDIT_AMOUNT_STEP:10000}

mysawit:
  public-base-url: ${MYSAWIT_PUBLIC_BASE_URL:}
  grpc:
    internal-token: ${MYSAWIT_GRPC_INTERNAL_TOKEN:}
