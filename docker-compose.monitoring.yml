services:
  postgres:
    image: postgres:16-alpine
    container_name: mysawit-pembayaran-postgres
    environment:
      POSTGRES_DB: mysawit_pembayaran
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mysawit_pembayaran"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysawit-pembayaran-postgres:/var/lib/postgresql/data

  app:
    build: .
    container_name: mysawit-pembayaran-app
    environment:
      PORT: 8085
      GRPC_PORT: 9090
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/mysawit_pembayaran
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JPA_DDL_AUTO: update
    ports:
      - "8085:8085"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: mysawit-pembayaran-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - mysawit-pembayaran-prometheus:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: mysawit-pembayaran-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - mysawit-pembayaran-grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysawit-pembayaran-postgres:
  mysawit-pembayaran-prometheus:
  mysawit-pembayaran-grafana:
